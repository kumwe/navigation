name: Package CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, simplexml, tokenizer, xmlwriter, zip
          coverage: none
          tools: composer:2.10.3

      - name: Install the validated package toolchain
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --abandoned=fail

      - name: Run complete package checks
        run: composer check
